<!DOCTYPE html>
<!-- Temporary render target for assets/social/*. Not shipped; see scripts/render_social.md -->
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../../styles/theme.css" />
    <link rel="stylesheet" href="../../styles/globe.css" />
    <script src="../../vendor/d3.v7.min.js"></script>
    <script src="../../vendor/topojson-client.min.js"></script>
    <style>
      html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
      body { display: block; }
      .og {
        width: 1200px; height: 630px; display: grid;
        grid-template-columns: 1fr 500px; align-items: center;
        padding: 0 56px 0 76px; box-sizing: border-box; gap: 28px;
      }
      .og-title {
        font-family: "Archivo Black", sans-serif; text-transform: uppercase;
        font-size: 5.6rem; line-height: 0.92; letter-spacing: -0.01em;
        color: var(--ink); margin: 0; text-shadow: 7px 7px 0 var(--bronze);
      }
      .og-tag {
        font-family: "Inter", sans-serif; font-weight: 700; font-size: 1.5rem;
        color: var(--ink-soft); margin: 26px 0 0;
      }
      .og-chips { display: flex; gap: 12px; margin-top: 34px; flex-wrap: wrap; }
      .og-chip {
        font-family: "Inter", sans-serif; font-weight: 800; text-transform: uppercase;
        letter-spacing: 0.04em; font-size: 0.95rem; padding: 12px 22px;
        border: 3px solid var(--line); border-radius: var(--radius-pill);
        background: var(--sheen-quiet); color: var(--ink); box-shadow: 0 4px 0 var(--line);
      }
      .og-chip.hot { background: var(--sheen-primary); color: var(--on-accent); }
      .globe-box { width: 500px; height: 500px; position: relative; }
      #globe { width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div class="og">
      <div>
        <h1 class="og-title">Atlas<br />Arcade</h1>
        <p class="og-tag">Name the country. Find it on the globe.</p>
        <div class="og-chips">
          <span class="og-chip hot">Play free</span>
          <span class="og-chip">Flags</span>
          <span class="og-chip">Capitals</span>
          <span class="og-chip">Locate</span>
        </div>
      </div>
      <div class="globe-box"><canvas id="globe"></canvas></div>
    </div>

    <script type="module">
      import { loadData } from "../../src/data.js";
      import { Globe } from "../../src/globe.js";
      await loadData();
      const g = new Globe(document.getElementById("globe"));
      g.setIdle(false);
      // Atlantic-facing view: shows the Americas, Europe and Africa at once
      g.projection.rotate([20, -12, 0]);
      g.resize();
      // wait for the land cover texture to decode, then paint a settled frame
      const ready = () => new Promise((res) => {
        const tick = () => (g._tex ? res() : setTimeout(tick, 60));
        tick();
      });
      await ready();
      await document.fonts.ready;
      g.render(true);
      window.__ogReady = true;
    </script>
  </body>
</html>
